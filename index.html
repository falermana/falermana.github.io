<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favor.png" type="image/png">
    <title>阿里云签到</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            /* 让容器根据内容自适应高度 */
            padding: 20px;
        }

        h1 {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 20px;
        }

        .button-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
        }

        .button {
            display: inline-block;
            padding: 15px 30px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            margin: 10px;
            flex: 1;
            /* 让按钮自动分配宽度 */
            text-align: center;
        }

        .button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 768px) {
            .button {
                width: 100%;
                margin: 10px 0;
            }
        }

        .input {
            width: calc(80% - 60px);
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            outline: none;
            background-color: #b6dffa;
            color: #181818;
            margin: 10px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        /* 当输入框获得焦点时改变边框颜色 */
        .input:focus {
            border-color: #3498db;
        }

        .quote-container {
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 80px;
            bottom: 0;
            z-index: 1000;
        }

        .quote {
            font-style: italic;
            font-size: 1.2em;
            color: #666;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 100%;
            word-wrap: break-word;
            white-space: normal;
            overflow: hidden;
        }

        .typing-effect {
            overflow: hidden;
            white-space: normal;
            position: relative;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 20px;
            background-color: black;
            margin-left: 5px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>阿里云签到导航</h1>
        <div class="button-row">
            <button id="loginButton" class="button">注意登录</button>
            <button id="blogButton" class="button">社区签到</button>
        </div>
        <div class="button-row">
            <button id="videoButton" class="button">看一视频</button>
            <button id="ujavaButton" class="button">感谢: J<sup>文&答×5</sup></button>
        </div>
        <div class="button-row">
            <button id="cButton" class="button">感谢: C<sup>文&答×5</sup></button>
            <button id="htmlButton" class="button">感谢: H<sup>文&答sp×5</sup></button>
        </div>
        <div class="button-row">
            <input class="input" type="text" id="linkInput" value="">
            <button id="markButton" class="button">书评一本</button>
        </div>
        <div class="button-row">
            <input class="input" type="text" id="textInput" value="">
            <button id="updateTextButton" class="button">保存书名</button>
        </div>
        <div class="button-row">
            <button id="articleButton" class="button">发文三篇</button>
            <button id="answerButton" class="button">回答十条</button>
        </div>
        <div class="button-row">
            <button id="getButton" class="button">完成任务-领取积分</button>
            <button id="listButton" class="button">任务中心-查看最新福利</button>
        </div>
    </div>
    <div class="quote-container">
        <div class="quote">
            <span class="typing-effect clickable-quote" id="quoteOfTheDay"></span>
            <span class="cursor"></span>
        </div>
    </div>

    <script src="https://lingtu.gitlab.io/links.js" defer></script>
    <script>
        // 功能区
        // 登录
        const loginLink = ["https://account.aliyun.com/login/login.htm"];
        // 社区签到
        const blogLinks = [
            "https://developer.aliyun.com/?spm=a2c6h.17735062.J_eBhO-wcawiLJRkGqHmozR.1.76b45b17dfjPK3",
            "https://developer.aliyun.com/modelscope/?spm=a2c6h.27925324.J_eBhO-wcawiLJRkGqHmozR.74.7e4e5425aMvM2r",
            "https://developer.aliyun.com/cloudnative/?spm=a2c6h.27925324.J_eBhO-wcawiLJRkGqHmozR.74.7b394c93PRLaED",
            "https://developer.aliyun.com/bigdata/?spm=a2c6h.12873639.article-detail.2.4734377b9Dpvzv",
            "https://developer.aliyun.com/database/?spm=a2c6h.27925324.detail.2.65ab22539515Ai",
            "https://developer.aliyun.com/ecs/?spm=a2c6h.27925324.J_eBhO-wcawiLJRkGqHmozR.2.3ce13cd5q2ExPP",
            "https://developer.aliyun.com/polardb/?spm=a2c6h.27925324.J_eBhO-wcawiLJRkGqHmozR.2.193152c48g0Vcb",
            "https://developer.aliyun.com/group/yunxiao/?spm=a2c6h.27925324.J_eBhO-wcawiLJRkGqHmozR.2.48ea657c68xBki",
            "https://developer.aliyun.com/storage/?spm=a2c6h.27925324.J_eBhO-wcawiLJRkGqHmozR.2.11ba71e6FbzeBR",
            "https://developer.aliyun.com/group/networking/?spm=a2c6h.27925324.J_eBhO-wcawiLJRkGqHmozR.2.1cad24985CFbje",
            "https://developer.aliyun.com/group/aliyun_linux/?spm=a2c6h.17735062.J_eBhO-wcawiLJRkGqHmozR.2.386259d6wIRYSu",
            "https://developer.aliyun.com/modelstudio/?spm=a2c6h.17735062.J_eBhO-wcawiLJRkGqHmozR.2.31ab6379QMm0uz",
            "",
            "https://developer.aliyun.com/computenest/?spm=a2c6h.17735062.J_eBhO-wcawiLJRkGqHmozR.2.72d05b177J6IFH",
            "https://developer.aliyun.com/iot/?spm=a2c6h.27925324.J_eBhO-wcawiLJRkGqHmozR.2.198e1c479k8aoN",
            "https://developer.aliyun.com/group/dns/?spm=a2c6h.27925324.J_eBhO-wcawiLJRkGqHmozR.2.533d7377CHfS06",
            "https://developer.aliyun.com/yitian/?spm=a2c6h.27925324.detail.2.458656f120Mi0B",
            "https://developer.aliyun.com/group/viapi/?spm=a2c6h.17735062.J_eBhO-wcawiLJRkGqHmozR.2.476d4b16zRwdfF",
            "https://developer.aliyun.com/group/wuying/?spm=a2c6h.17735062.J_eBhO-wcawiLJRkGqHmozR.2.21f63da3LeIMIo",
            "https://developer.aliyun.com/tongyi/?spm=a2c6h.17735062.J_eBhO-wcawiLJRkGqHmozR.2.4d0c6515zCRMG9"
        ];
        // 看一次视频
        const videoLink = ["https://developer.aliyun.com/live/?spm=a2c6h.27120161.J_7073166060.3.260e1721fNRlMg"];
        // 发文3篇
        const articleLink = [
            "https://developer.aliyun.com/article/new?spm=a2c6h.27120161.J_eBhO-wcawiLJRkGqHmozR.91.1b151721OgPd1j#/",
            "https://developer.aliyun.com/article/new?spm=a2c6h.27120161.J_eBhO-wcawiLJRkGqHmozR.91.1b151721OgPd1j#/",
            "https://developer.aliyun.com/article/new?spm=a2c6h.27120161.J_eBhO-wcawiLJRkGqHmozR.91.1b151721OgPd1j#/"
        ];
        // 回答10个
        const answerLink = [
            "https://developer.aliyun.com/ask/unsolvedQuestionsWithProduct?spm=a2c6h.13066354.ask-index.dunsolvedWithProduct.63ef5b71uAt594"
        ];
        // 书评一本
        const getLink = ["https://developer.aliyun.com/score?spm=a2c6h.12873639.J_eBhO-wcawiLJRkGqHmozR.87.73eb7f6fc6H8Q9"];
        // 查看最新任务
        const listLink = ["https://developer.aliyun.com/mission?spm=a2c6h.27120161.J_eBhO-wcawiLJRkGqHmozR.67.31431721v6bo7V"];
        // Java的细水长流主页
        const ujavaLink = ["https://developer.aliyun.com/profile/rxl52vwtiluny?spm=a2c6h.12873639.article-detail.9.42cb7c65rTtbrK"];
        // c的前世今生主页
        const cLink = ["https://developer.aliyun.com/profile/27ur2cslks2rk?spm=a2c6h.12873639.article-detail.23.e7f974b0Ib8awM"];
        // html的七十二变主页
        const htmlLink = ["https://developer.aliyun.com/profile/dsnmvtuxoyeqg?spm=a2c6h.13262185.profile.4.16d47c496tcHwT"];
        // 原有的打开链接函数保持不变
        function openAllLinks(linkArray) {
            let index = 0;
            const interval = setInterval(() => {
                if (index < linkArray.length) {
                    window.open(linkArray[index], '_blank');
                    index++;
                } else {
                    clearInterval(interval);
                }
            }, 1000);
        }
        // 初始化所有按钮的点击计数器
        const buttonCounts = {
            loginButton: 0,
            blogButton: 0,
            videoButton: 0,
            articleButton: 0,
            answerButton: 0,
            getButton: 0,
            listButton: 0,
            ujavaButton: 0,
            cButton: 0,
            htmlButton: 0
        };

        // 定义颜色变化函数
        function changeButtonColor(buttonId, color) {
            document.getElementById(buttonId).style.backgroundColor = color;
        }

        // 给每个按钮添加点击事件处理程序
        function handleButtonClick(buttonId, linkArray) {
            return function () {
                let count = buttonCounts[buttonId];
                switch (++count % 5) {
                    case 1:
                        changeButtonColor(buttonId, '#00b3b0');
                        break;
                    case 2:
                        changeButtonColor(buttonId, '#49b300');
                        break;
                    case 3:
                        changeButtonColor(buttonId, '#ffb000');
                        break;
                    case 4:
                        changeButtonColor(buttonId, '#ff3e31');
                        break;
                    case 0:
                        changeButtonColor(buttonId, '#9758ff');
                        break;
                }
                // 更新计数器
                buttonCounts[buttonId] = count;
                // 打开链接
                openAllLinks(linkArray);
            };
        }

        // 替换原有的事件绑定
        document.getElementById('loginButton').addEventListener('click', handleButtonClick('loginButton', loginLink));
        document.getElementById('blogButton').addEventListener('click', handleButtonClick('blogButton', blogLinks));
        document.getElementById('videoButton').addEventListener('click', handleButtonClick('videoButton', videoLink));
        document.getElementById('articleButton').addEventListener('click', handleButtonClick('articleButton', articleLink));
        document.getElementById('answerButton').addEventListener('click', handleButtonClick('answerButton', answerLink));
        document.getElementById('getButton').addEventListener('click', handleButtonClick('getButton', getLink));
        document.getElementById('listButton').addEventListener('click', handleButtonClick('listButton', listLink));
        document.getElementById('ujavaButton').addEventListener('click', handleButtonClick('ujavaButton', ujavaLink));
        document.getElementById('cButton').addEventListener('click', handleButtonClick('cButton', cLink));
        document.getElementById('htmlButton').addEventListener('click', handleButtonClick('htmlButton', htmlLink));
        /* 书评逻辑 */
        document.addEventListener('DOMContentLoaded', () => {
            const linkInput = document.getElementById('linkInput');
            const textInput = document.getElementById('textInput');
            const storedLink = localStorage.getItem('link') || '';
            const storedText = localStorage.getItem('text') || '';
            linkInput.value = `保存链接：${storedLink}`;
            textInput.value = `页&书名：${storedText}`;
        });

        // 点击左边按钮打开链接并更新本地存储
        document.getElementById('markButton').addEventListener('click', () => {
            const linkInput = document.getElementById('linkInput');
            const link = linkInput.value.replace('保存链接：', '');
            if (link) {
                localStorage.setItem('link', link);
                window.open(link, '_blank');
            }
        });

        // 点击右边按钮更新本地存储的文字
        document.getElementById('updateTextButton').addEventListener('click', () => {
            const textInput = document.getElementById('textInput');
            const text = textInput.value.replace('页&书名：', '');
            if (text) {
                localStorage.setItem('text', text);
            }
        });
        /* 底部一言逻辑 */
        // 定义 fetchAndDisplayQuote 函数
        async function fetchAndDisplayQuote() {
            try {
                // 清除之前的定时器
                if (typeWriterTimeoutId) {
                    clearTimeout(typeWriterTimeoutId);
                }

                // 清空名言区域
                const quoteElement = document.getElementById('quoteOfTheDay');
                quoteElement.innerHTML = '';

                const response = await fetch('https://open.saintic.com/api/sentence/');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                const quoteText = ` “ ${data.data.sentence} ” —— ${data.data.author}《${data.data.name}》`;

                let index = 0;
                const baseTypingSpeed = 100; // 基础打字速度，单位为毫秒

                function typeWriter() {
                    if (index < quoteText.length) {
                        const char = quoteText.charAt(index);
                        quoteElement.innerHTML += char;
                        index++;

                        // 随机化打字速度
                        const typingSpeed = Math.random() * 50 + baseTypingSpeed;
                        typeWriterTimeoutId = setTimeout(typeWriter, typingSpeed);
                    } else {
                        // 移除光标
                        document.querySelector('.cursor').style.display = 'none';
                    }
                }

                // 开始打字前先显示光标
                document.querySelector('.cursor').style.display = 'inline-block';
                typeWriter();
            } catch (error) {
                console.error('Error fetching quote:', error);
            }
        }

        let typeWriterTimeoutId;

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', () => {
            fetchAndDisplayQuote();

            // 给名言区域添加点击事件
            const quoteElement = document.querySelector('.clickable-quote');
            quoteElement.addEventListener('click', fetchAndDisplayQuote);
        });
    </script>
</body>

</html>
